  /scheduled/news:
    post:
      operationId: refreshScheduledNews
      tags: [news]
      summary: Authenticated hourly scheduler callback (Asia/Ho_Chi_Minh)
      description: Machine-to-machine only. Uses NEWS_SCHEDULER_TOKEN, not a member session. Successful runs are idempotent per Vietnam-time hour (scheduledSlot).
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer scheduler credential supplied by the external scheduling service.
      responses:
        "200":
          description: Completed, or already completed for this hour
          content:
            application/json:
              schema:
                type: object
                required: [scheduledDay, scheduledSlot, timezone, inserted, skipped, alreadyCompleted]
                properties:
                  scheduledDay:
                    type: string
                    format: date
                  scheduledSlot:
                    type: string
                    description: Vietnam-time hour, "YYYY-MM-DDTHH"
                  timezone:
                    type: string
                  inserted:
                    type: integer
                  skipped:
                    type: integer
                  alreadyCompleted:
                    type: boolean
        "401":
          description: Invalid scheduler credential
        "429":
          description: A collection is already running; retry later
        "502":
          description: Collection failed and may be retried
        "503":
          description: Scheduler credential not configured
