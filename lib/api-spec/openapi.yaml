openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companies
    description: Company capability profiles
  - name: projects
    description: Demand-side projects
  - name: matches
    description: Matching and collaboration status
  - name: solutions
    description: Joint solution portfolio
  - name: performance
    description: Performance and contribution logs
  - name: talent
    description: Talent pool job postings and seekers
  - name: clientCompanies
    description: Korean FDI manufacturing client directory (KOTRA)
  - name: dashboard
    description: Aggregated dashboard data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [hardware, software]
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    delete:
      operationId: deleteCompany
      tags: [companies]
      summary: Delete a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /companies/leaderboard:
    get:
      operationId: getCompanyLeaderboard
      tags: [companies]
      summary: Top companies by trust score
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"

  /companies/analyze-material:
    post:
      operationId: analyzeCompanyMaterial
      tags: [companies]
      summary: Analyze a promotional material file and extract company profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeMaterialInput"
      responses:
        "200":
          description: Extracted company profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeMaterialResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, matching, in_progress, completed]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (triggers matching)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/recommendations:
    get:
      operationId: getProjectRecommendations
      tags: [projects]
      summary: AI synergy-based recommended companies for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"

  /projects/{id}/matches:
    get:
      operationId: listProjectMatches
      tags: [matches]
      summary: List matches for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined]
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Invite a company to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
  /matches/{id}:
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update match status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /solutions:
    get:
      operationId: listSolutions
      tags: [solutions]
      summary: List joint solutions
      parameters:
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Solutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Solution"
    post:
      operationId: createSolution
      tags: [solutions]
      summary: Create a joint solution package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolutionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
  /solutions/{id}:
    get:
      operationId: getSolution
      tags: [solutions]
      summary: Get a joint solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSolution
      tags: [solutions]
      summary: Update a joint solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolutionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
    delete:
      operationId: deleteSolution
      tags: [solutions]
      summary: Delete a joint solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /performance:
    get:
      operationId: listPerformanceLogs
      tags: [performance]
      summary: List performance logs
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceLog"
    post:
      operationId: createPerformanceLog
      tags: [performance]
      summary: Record a contribution log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceLog"
  /performance/{id}:
    patch:
      operationId: updatePerformanceLog
      tags: [performance]
      summary: Update a performance log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceLogUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePerformanceLog
      tags: [performance]
      summary: Delete a performance log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /talent:
    get:
      operationId: listTalentPosts
      tags: [talent]
      summary: List talent pool posts
      parameters:
        - name: postType
          in: query
          required: false
          schema:
            type: string
            enum: [hiring, seeking]
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TalentPost"
    post:
      operationId: createTalentPost
      tags: [talent]
      summary: Create a talent pool post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentPost"

  /talent/{id}:
    patch:
      operationId: updateTalentPost
      tags: [talent]
      summary: Update a talent pool post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentPostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTalentPost
      tags: [talent]
      summary: Delete a talent pool post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /supply-offers:
    get:
      operationId: listSupplyOffers
      tags: [supplyOffers]
      summary: List supply offers (raw materials, parts) from partner companies
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Supply offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyOffer"
    post:
      operationId: createSupplyOffer
      tags: [supplyOffers]
      summary: Create a supply offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOfferInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOffer"

  /supply-offers/{id}:
    patch:
      operationId: updateSupplyOffer
      tags: [supplyOffers]
      summary: Update a supply offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOfferUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOffer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSupplyOffer
      tags: [supplyOffers]
      summary: Delete a supply offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /offer-matches:
    get:
      operationId: listOfferMatches
      tags: [offerMatches]
      summary: List offer match requests (admin only)
      responses:
        "200":
          description: Offer matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferMatch"
    post:
      operationId: createOfferMatch
      tags: [offerMatches]
      summary: Request a match against a supply offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferMatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferMatch"

  /offer-matches/{id}:
    patch:
      operationId: updateOfferMatch
      tags: [offerMatches]
      summary: Update an offer match (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferMatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferMatch"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOfferMatch
      tags: [offerMatches]
      summary: Delete an offer match (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /client-companies:
    get:
      operationId: listClientCompanies
      tags: [clientCompanies]
      summary: List Korean FDI manufacturing client companies (KOTRA directory)
      responses:
        "200":
          description: Client company directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientCompany"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Aggregated platform metrics
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Company:
      type: object
      required:
        - id
        - name
        - type
        - taxCode
        - phone
        - kakaoTalkId
        - description
        - location
        - capabilityTags
        - techSpecs
        - contactEmail
        - logoUrl
        - trustScore
        - rating
        - projectsCompleted
        - collaborationCount
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [hardware, software]
        taxCode:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        kakaoTalkId:
          type: ["string", "null"]
        description:
          type: string
        location:
          type: string
        capabilityTags:
          type: array
          items:
            type: string
        techSpecs:
          type: string
        contactEmail:
          type: string
        logoUrl:
          type: ["string", "null"]
        trustScore:
          type: integer
        rating:
          type: number
        projectsCompleted:
          type: integer
        collaborationCount:
          type: integer
        createdAt:
          type: string
    CompanyInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [hardware, software]
        taxCode:
          type: string
        phone:
          type: string
        kakaoTalkId:
          type: string
        description:
          type: string
        location:
          type: string
        capabilityTags:
          type: array
          items:
            type: string
        techSpecs:
          type: string
        contactEmail:
          type: string
        logoUrl:
          type: string
    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [hardware, software]
        taxCode:
          type: string
        phone:
          type: string
        kakaoTalkId:
          type: string
        description:
          type: string
        location:
          type: string
        capabilityTags:
          type: array
          items:
            type: string
        techSpecs:
          type: string
        contactEmail:
          type: string
        logoUrl:
          type: string

    ClientCompany:
      type: object
      required:
        - no
        - nameKo
        - nameEn
        - parentCompany
        - entryType
        - investmentType
        - industry
        - industryDetail
        - region
        - address
        - postalCode
      properties:
        no:
          type: integer
        nameKo:
          type: string
        nameEn:
          type: string
        parentCompany:
          type: string
        entryType:
          type: string
        investmentType:
          type: string
        industry:
          type: string
        industryDetail:
          type: string
        region:
          type: string
        address:
          type: string
        postalCode:
          type: string

    AnalyzeMaterialInput:
      type: object
      required:
        - fileBase64
        - mimeType
      properties:
        fileBase64:
          type: string
          description: Base64-encoded content of the promotional material (image or PDF), without data URI prefix
        mimeType:
          type: string
          description: MIME type of the uploaded file (e.g. image/png, application/pdf)

    AnalyzeMaterialResult:
      type: object
      required:
        - name
        - type
        - taxCode
        - phone
        - kakaoTalkId
        - description
        - location
        - capabilityTags
        - techSpecs
        - contactEmail
      properties:
        name:
          type: string
        type:
          type: string
          enum: [hardware, software]
        taxCode:
          type: string
        phone:
          type: string
        kakaoTalkId:
          type: string
        description:
          type: string
        location:
          type: string
        capabilityTags:
          type: array
          items:
            type: string
        techSpecs:
          type: string
        contactEmail:
          type: string

    Project:
      type: object
      required:
        - id
        - title
        - description
        - demandCompany
        - category
        - requiredTags
        - budget
        - status
        - deadline
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        demandCompany:
          type: string
        category:
          type: string
        requiredTags:
          type: array
          items:
            type: string
        budget:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, matching, in_progress, completed]
        deadline:
          type: ["string", "null"]
        createdAt:
          type: string
    ProjectInput:
      type: object
      required:
        - title
        - description
        - demandCompany
        - category
        - requiredTags
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        demandCompany:
          type: string
        category:
          type: string
        requiredTags:
          type: array
          items:
            type: string
        budget:
          type: string
        deadline:
          type: string
    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        demandCompany:
          type: string
        category:
          type: string
        requiredTags:
          type: array
          items:
            type: string
        budget:
          type: string
        status:
          type: string
          enum: [open, matching, in_progress, completed]
        deadline:
          type: string

    Recommendation:
      type: object
      required:
        - company
        - synergyScore
        - matchedTags
