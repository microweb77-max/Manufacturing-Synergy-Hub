components:
  schemas:
    CompanyVerification:
      type: object
      required: [verified, method]
      properties:
        verified: { type: boolean }
        method: { type: [string, "null"] }
    MyCompany:
      type: object
      required: [companyId, name, role]
      properties:
        companyId: { type: integer }
        name: { type: string }
        role: { type: string, enum: [company_admin, staff] }
    CompanyMember:
      type: object
      required: [id, companyId, userId, role, createdAt]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        userId: { type: string }
        role: { type: string, enum: [company_admin, staff] }
        createdAt: { type: string }
    CompanyInvitation:
      type: object
      required: [id, email, role, status, expiresAt]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, enum: [company_admin, staff] }
        status: { type: string }
        expiresAt: { type: string }
    CompanyClaimStatus:
      type: object
      required: [id, method, status, expiresAt, reviewNote]
      properties:
        id: { type: integer }
        method: { type: string, enum: [email, manual] }
        status: { type: string }
        expiresAt: { type: string }
        reviewNote: { type: [string, "null"] }
    CompanyMembership:
      type: object
      required: [verified, role, members, invitations, claims]
      properties:
        verified: { type: boolean }
        role: { type: [string, "null"], enum: [company_admin, staff, null] }
        members: { type: array, items: { $ref: "#/components/schemas/CompanyMember" } }
        invitations: { type: array, items: { $ref: "#/components/schemas/CompanyInvitation" } }
        claims: { type: array, items: { $ref: "#/components/schemas/CompanyClaimStatus" } }
    CompanyClaimReview:
      type: object
      required: [id, companyId, companyName, userId, method, status, expiresAt, taxCode, registeredTaxCode, reviewNote]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        companyName: { type: string }
        userId: { type: string }
        method: { type: string }
        status: { type: string }
        expiresAt: { type: string }
        taxCode: { type: [string, "null"] }
        registeredTaxCode: { type: [string, "null"] }
        reviewNote: { type: [string, "null"] }
    CompanyClaimInput:
      type: object
      required: [companyId, method]
      properties:
        companyId: { type: integer, minimum: 1 }
        method: { type: string, enum: [email, manual] }
        taxCode: { type: string }
        evidenceData: { type: string, description: "PNG/JPEG/PDF data URL up to 5MB, persisted privately in App Storage" }
    CompanyClaimDecision:
      type: object
      required: [decision, note]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, minLength: 1, maxLength: 1000 }
    CompanyInvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [company_admin, staff] }
    CompanyLinkInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
    CompanyLinkResult:
      type: object
      required: [companyId]
      properties:
        companyId: { type: integer }
    MembershipSubmission:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: integer }
        status: { type: string }
        expiresAt: { type: string }
    MembershipResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    TalentContactRequest:
      type: object
      required: [id, talentPostId, seekerName, postTitle, companyName, contactPerson, phone, email, status, createdAt]
      properties:
        id:
          type: integer
        talentPostId:
          type: integer
        seekerName:
          type: string
        postTitle:
          type: string
        companyName:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [pending, completed]
        createdAt:
          type: string
    TalentContactRequestInput:
      type: object
      required: [talentPostId, companyName, contactPerson]
      properties:
        talentPostId:
          type: integer
        companyName:
          type: string
          minLength: 1
        contactPerson:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
    TalentContactRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, completed]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Company:
      type: object
      required:
        - id
        - name
        - type
        - taxCode
        - phone
        - kakaoTalkId
        - description
        - location
        - capabilityTags
        - techSpecs
        - contactEmail
        - logoUrl
        - trustScore
        - rating
        - projectsCompleted
        - collaborationCount
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [hardware, software, service, customer, supplier]
        taxCode:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        kakaoTalkId:
          type: ["string", "null"]
        description:
          type: string
        location:
          type: string
        capabilityTags:
          type: array
          items:
            type: string
        techSpecs:
          type: string
        contactEmail:
          type: string
        logoUrl:
          type: ["string", "null"]
        trustScore:
          type: integer
        rating:
          type: number
        projectsCompleted:
          type: integer
        collaborationCount:
          type: integer
        createdAt:
          type: string
    CompanyInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [hardware, software, service, customer, supplier]
        taxCode:
          type: string
        phone:
          type: string
        kakaoTalkId:
          type: string
        description:
          type: string
        location:
          type: string
        capabilityTags:
          type: array
          items:
            type: string
        techSpecs:
