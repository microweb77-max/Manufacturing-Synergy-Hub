openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companies
    description: Company capability profiles
  - name: projects
    description: Demand-side projects
  - name: matches
    description: Matching and collaboration status
  - name: solutions
    description: Joint solution portfolio
  - name: performance
    description: Performance and contribution logs
  - name: talent
    description: Talent pool job postings and seekers
  - name: clientCompanies
    description: Korean FDI manufacturing client directory (KOTRA)
  - name: events
    description: Vietnam manufacturing/automation/AI events
  - name: me
    description: Signed-in member bookmarks and alert preferences
  - name: news
    description: Vietnam manufacturing news (crawled and translated to Korean)
  - name: banners
    description: Dashboard promotional banners (rotating carousel)
  - name: dashboard
    description: Aggregated dashboard data
paths:
  /companies/{id}/verification:
    get:
      operationId: getCompanyVerification
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Public verification badge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyVerification" }
  /membership/mine:
    get:
      operationId: listMyCompanies
      responses:
        "200":
          description: Current verified memberships
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MyCompany" } }
  /membership/companies/{id}:
    get:
      operationId: getCompanyMembership
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Own claims and company management state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyMembership" }
  /membership/claims:
    get:
      operationId: listCompanyClaims
      responses:
        "200":
          description: Platform administrator review queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CompanyClaimReview" } }
    post:
      operationId: createCompanyClaim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyClaimInput" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipSubmission" }
  /membership/claims/{id}:
    delete:
      operationId: cancelCompanyClaim
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Cancelled }
    patch:
      operationId: reviewCompanyClaim
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyClaimDecision" }
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipResult" }
  /membership/claims/{id}/evidence:
    get:
      operationId: downloadCompanyClaimEvidence
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Private evidence attachment for applicant or reviewer
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /membership/consume:
    post:
      operationId: consumeCompanyLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyLinkInput" }
      responses:
        "200":
          description: Claimed or joined existing company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyLinkResult" }
  /membership/companies/{id}/invitations:
    post:
      operationId: inviteCompanyMember
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInvitationInput" }
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipSubmission" }
  /membership/companies/{id}/invitations/{invitationId}:
    delete:
      operationId: cancelCompanyInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: invitationId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Cancelled }
  /membership/companies/{id}/members/{memberId}:
    delete:
      operationId: removeCompanyMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: memberId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
  /talent-contact-requests:
    get:
      operationId: listTalentContactRequests
      tags: [talent]
      summary: List talent contact requests (admin only)
      parameters: []
      responses:
        "200":
          description: Contact requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TalentContactRequest"
    post:
      operationId: createTalentContactRequest
      tags: [talent]
      summary: Create a contact request for a seeking post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentContactRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentContactRequest"
  /talent-contact-requests/{id}:
    patch:
      operationId: updateTalentContactRequest
      tags: [talent]
      summary: Update contact request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentContactRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentContactRequest"
    delete:
      operationId: deleteTalentContactRequest
      tags: [talent]
      summary: Delete a contact request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /auth/me:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Get verified session and platform permissions
      responses:
        "200":
          description: Current session (anonymous visitors have no privileges)
          content:
            application/json:
              schema:
                type: object
                required: [userId, isAdmin]
                properties:
                  userId:
                    type: [string, "null"]
                  isAdmin:
                    type: boolean
        "503":
          description: Account verification unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [hardware, software, service, customer, supplier]
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    delete:
      operationId: deleteCompany
      tags: [companies]
      summary: Delete a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /companies/leaderboard:
    get:
      operationId: getCompanyLeaderboard
      tags: [companies]
      summary: Top companies by trust score
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"

  /companies/analyze-material:
    post:
      operationId: analyzeCompanyMaterial
      tags: [companies]
      summary: Analyze a promotional material file and extract company profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeMaterialInput"
      responses:
        "200":
          description: Extracted company profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeMaterialResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many analysis requests for this verified account on this server instance
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until another request can be attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, matching, in_progress, completed]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (triggers matching)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/recommendations:
    get:
      operationId: getProjectRecommendations
      tags: [projects]
      summary: AI synergy-based recommended companies for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"

  /projects/{id}/matches:
    get:
      operationId: listProjectMatches
      tags: [matches]
      summary: List matches for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined]
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Invite a company to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
  /matches/{id}:
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update match status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /solutions:
    get:
      operationId: listSolutions
      tags: [solutions]
      summary: List joint solutions
      parameters:
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Solutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Solution"
    post:
      operationId: createSolution
      tags: [solutions]
      summary: Create a joint solution package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolutionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
  /solutions/{id}:
    get:
      operationId: getSolution
      tags: [solutions]
      summary: Get a joint solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSolution
      tags: [solutions]
      summary: Update a joint solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolutionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
    delete:
      operationId: deleteSolution
      tags: [solutions]
      summary: Delete a joint solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /performance:
    get:
      operationId: listPerformanceLogs
      tags: [performance]
      summary: List performance logs
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceLog"
    post:
      operationId: createPerformanceLog
      tags: [performance]
      summary: Record a contribution log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceLog"
  /performance/{id}:
    patch:
      operationId: updatePerformanceLog
      tags: [performance]
      summary: Update a performance log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceLogUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePerformanceLog
      tags: [performance]
      summary: Delete a performance log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /talent:
    get:
      operationId: listTalentPosts
      tags: [talent]
      summary: List talent pool posts
      parameters:
        - name: postType
          in: query
          required: false
          schema:
            type: string
            enum: [hiring, seeking]
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TalentPost"
    post:
      operationId: createTalentPost
      tags: [talent]
      summary: Create a talent pool post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentPost"

  /talent/{id}:
    patch:
      operationId: updateTalentPost
      tags: [talent]
      summary: Update a talent pool post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentPostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTalentPost
      tags: [talent]
      summary: Delete a talent pool post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /talent/collect-jobs:
    post:
      operationId: collectJobs
      tags: [talent]
      summary: Auto-collect Vietnam manufacturing talent posts via web search — hiring (구인) or seeking (구직) per postType
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectJobsRequest"
      responses:
        "200":
          description: Collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectJobsResult"
        "502":
          description: Collection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /supply-offers:
    get:
      operationId: listSupplyOffers
      tags: [supplyOffers]
      summary: List supply offers (raw materials, parts) from partner companies
      description: Public browsing is allowed. unitPrice is "xxx" without a verified signed-in session; signed-in members receive the actual price. Responses must not be stored in shared caches.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Supply offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyOffer"
    post:
      operationId: createSupplyOffer
      tags: [supplyOffers]
      summary: Create a supply offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOfferInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOffer"

  /supply-offers/{id}:
    patch:
      operationId: updateSupplyOffer
      tags: [supplyOffers]
      summary: Update a supply offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOfferUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOffer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSupplyOffer
      tags: [supplyOffers]
      summary: Delete a supply offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /offer-matches:
    get:
      operationId: listOfferMatches
      tags: [offerMatches]
      summary: List offer match requests (admin only)
      responses:
        "200":
          description: Offer matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferMatch"
    post:
      operationId: createOfferMatch
      tags: [offerMatches]
      summary: Request a match against a supply offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferMatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferMatch"

  /offer-matches/{id}:
    patch:
      operationId: updateOfferMatch
      tags: [offerMatches]
      summary: Update an offer match (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferMatchUpdate"
      responses:
