name: Claude Code

# Cowork(설계) → Claude Code(개발) 자동화
# - Issue 본문/제목에 @claude 가 있거나, Issue에 "claude" 라벨을 붙이면 실행
# - Issue/PR 댓글에서 @claude 로 추가 요청 가능
# Claude가 docs/specs 설계서와 CLAUDE.md 규칙에 따라 구현하고 PR을 만듭니다.
# 인증: 저장소 Secret CLAUDE_CODE_OAUTH_TOKEN (Claude 구독, `claude setup-token`으로 발급)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synergy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/synergy
      PORT: "3000"
      BASE_PATH: /

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies & prepare DB
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/db run push

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(pnpm:*),Bash(node:*),Bash(npx:*),Bash(git:*),Bash(curl:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*),Bash(sleep:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*)"
            --append-system-prompt "Follow CLAUDE.md, especially the 'Cowork → Claude Code workflow' section. When the work for an issue is complete and verified, open the pull request yourself with gh pr create --base main (Korean title/description, include 'Closes #<issue>'), then post the PR link in your reply. Reply to the user in Korean."
